name: cron probe

# TEMPORARY diagnostic: proves whether GitHub's cron scheduler fires for this
# repo at all. Every 5 minutes (the GitHub minimum). Delete this file once the
# answer is known - it burns one runner-minute per firing.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: stamp
        run: echo "cron probe fired at $(date -u +%Y-%m-%dT%H:%M:%SZ) on $(git rev-parse --short HEAD)"
