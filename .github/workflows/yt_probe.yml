name: yt player-client probe

# TEMPORARY diagnostic: find a yt-dlp extractor configuration that can
# DOWNLOAD from a GitHub runner IP (YouTube blocks datacenter ranges with
# "Sign in to confirm you're not a bot"). Delete once a winner is found.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp

      - name: matrix
        run: |
          set +e
          URL="https://www.youtube.com/shorts/JX0ZNfgYnak"
          for CL in default android ios tv tv_simply web_safari mweb android_vr web_embedded tv_embedded; do
            if [ "$CL" = "default" ]; then
              ARGS=""
            else
              ARGS="--extractor-args youtube:player_client=$CL"
            fi
            OUT=$(yt-dlp $ARGS --no-warnings -f "bv*[height<=720]+ba/b" \
                  --merge-output-format mp4 -o "/tmp/t_$CL.%(ext)s" "$URL" 2>&1 || true)
            if ls /tmp/t_$CL.* >/dev/null 2>&1; then
              SZ=$(du -h /tmp/t_$CL.* 2>/dev/null | head -1 | cut -f1)
              echo "RESULT $CL OK size=$SZ"
              rm -f /tmp/t_$CL.*
            else
              echo "RESULT $CL FAIL $(echo "$OUT" | tail -1 | cut -c1-140)"
            fi
          done
          echo "MATRIX DONE"
