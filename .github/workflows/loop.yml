name: RGCIPZAH repost loop

# Every 2 hours (matches the anti-spam post gap), plus a manual run button.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

# never let two cycles overlap; state is committed back after each run
concurrency:
  group: rgclipzah-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (not preinstalled on the runner)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt

      - name: Smoke-test the edit chain on runner ffmpeg
        run: |
          set -e
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc2=size=720x1280:rate=30:duration=3 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -shortest -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac smoke-src.mp4
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from agency import editclip
          out = editclip.render(Path('smoke-src.mp4'), Path('smoke-out.mp4'))
          print('smoke render:', 'OK' if out else 'FAILED')
          sys.exit(0 if out else 1)
          PY
          rm -f smoke-src.mp4 smoke-out.mp4

      - name: Restore browser cookies (if the secret is set)
        env:
          YTDL_COOKIES: ${{ secrets.YTDL_COOKIES_FILE }}
        run: |
          if [ -n "$YTDL_COOKIES" ]; then
            printf '%s\n' "$YTDL_COOKIES" > cookies.txt
            echo "cookies restored"
          fi

      - name: Run one repost cycle (discover -> edit -> post)
        env:
          RGCLIP_LOOP: "1"
          RGCLIP_MAX_PER_CYCLE: "1"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PUBLIC_URL_BASE: ${{ secrets.IG_PUBLIC_URL_BASE }}
          IG_UPLOAD_ENDPOINT: ${{ secrets.IG_UPLOAD_ENDPOINT }}
          IG_UPLOAD_ACCESS_KEY: ${{ secrets.IG_UPLOAD_ACCESS_KEY }}
          IG_UPLOAD_SECRET_KEY: ${{ secrets.IG_UPLOAD_SECRET_KEY }}
          IG_UPLOAD_REGION: ${{ secrets.IG_UPLOAD_REGION }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_SHORT_TOKEN: ${{ secrets.FB_SHORT_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python run_loop.py

      - name: Persist state (dedupe, caps, throttle)
        run: |
          git config user.name "rgclipzah-loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repost_state.json
          git diff --cached --quiet || git commit -m "loop state $(date -u +%Y%m%d-%H%M)"
          git push
